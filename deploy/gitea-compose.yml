# Gitea, the self-hosted forge gitai is primarily built for.
#
#   docker compose -f gitea-compose.yml up -d
#
# Forgejo is a drop-in swap: change the image to codeberg.org/forgejo/forgejo:11
# and the FORGEJO__ prefix for the environment keys. gitai's Gitea adapter
# serves both.

services:
  gitea:
    image: gitea/gitea:1
    container_name: gitea
    restart: unless-stopped

    environment:
      # Match these to the user that owns ./gitea-data, or the container will
      # fight the host over file permissions.
      USER_UID: 1000
      USER_GID: 1000

      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__SSH_PORT: "2222"

      # The one that catches everybody. Gitea refuses to deliver webhooks to
      # private or loopback addresses by default, and gitai listens on exactly
      # such an address. Without this the hook silently never fires.
      GITEA__webhook__ALLOWED_HOST_LIST: private,loopback

      GITEA__database__DB_TYPE: sqlite3

    volumes:
      - ./gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    ports:
      - "3000:3000"
      - "2222:22"

    extra_hosts:
      # Lets the webhook reach gitai running on the host as
      # http://host.docker.internal:8080. On Linux this maps to the docker
      # bridge gateway; without it the container has no name for the host.
      - "host.docker.internal:host-gateway"
